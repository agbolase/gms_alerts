workflows:
  android-apk:
    name: Android APK
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: 3.32.0
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
